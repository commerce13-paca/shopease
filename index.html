<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paiement Orange Money - PayDunya</title>
    <style>
        /* ===== STYLES CSS ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 100%;
        }

        h1 {
            font-size: 1.8rem;
            color: #1a202c;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: #2d3748;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f7fafc;
        }

        input:focus, select:focus {
            border-color: #ff7a00;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 122, 0, 0.15);
            background: white;
        }

        small {
            display: block;
            margin-top: 0.3rem;
            color: #a0aec0;
            font-size: 0.8rem;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff7a00 0%, #e06900 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 122, 0, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 1.2rem;
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        #message.success {
            display: block;
            background: #e6fffa;
            color: #006b4d;
            border: 2px solid #38b2ac;
        }

        #message.error {
            display: block;
            background: #fff5f5;
            color: #9b2c2c;
            border: 2px solid #fc8181;
        }

        #message.info {
            display: block;
            background: #ebf8ff;
            color: #2a4365;
            border: 2px solid #63b3ed;
        }

        #loading {
            margin-top: 1rem;
            padding: 0.8rem;
            background: #edf2f7;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            color: #4a5568;
            display: none;
        }

        #loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top: 3px solid #ff7a00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .footer {
            margin-top: 1.5rem;
            text-align: center;
            color: #a0aec0;
            font-size: 0.75rem;
        }

        .footer a {
            color: #ff7a00;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Debug */
        #debug {
            margin-top: 1rem;
            padding: 0.8rem;
            background: #2d3748;
            color: #a0aec0;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Paiement Mobile <span class="badge">TEST</span></h1>
        <p class="subtitle">Payez en toute sécurité avec Orange Money ou Wave</p>

        <form id="paymentForm">
            <div class="form-group">
                <label for="operator">📡 Opérateur</label>
                <select id="operator" required>
                    <option value="ORANGE_SN">Orange Money Sénégal</option>
                    <option value="WAVE_SN">Wave Sénégal</option>
                    <option value="FREE_SN">Free Money Sénégal</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">📱 Numéro de téléphone</label>
                <input type="tel" id="phone" placeholder="77 123 45 67" required />
                <small>Format : 9 chiffres sans indicatif (ex: 771234567)</small>
            </div>

            <div class="form-group">
                <label for="amount">💰 Montant (CFA)</label>
                <input type="number" id="amount" placeholder="1000" value="1000" min="100" required />
                <small>Montant minimum : 100 CFA</small>
            </div>

            <input type="hidden" id="orderId" value="" />

            <button type="submit" id="payBtn">💳 Payer maintenant</button>
        </form>

        <div id="message"></div>
        <div id="loading"><span class="spinner"></span> Traitement en cours...</div>

        <!-- Zone de debug -->
        <div id="debug"></div>

        <div class="footer">
            🔒 Paiement sécurisé via <a href="https://paydunya.com" target="_blank">PayDunya</a> • Mode Test
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION - TES CLÉS API PAYDUNYA (MODE TEST)
        // ============================================================
        const PAYDUNYA_CONFIG = {
            MASTER_KEY: 'JxFWG9byz8M75c7IZcha',
            PRIVATE_KEY: 'test_private_wvQw3PNvrf0J5fvAEynk6iCXQIy',
            PUBLIC_KEY: 'test_public_mfyvRXrETK2n50tgQWsXa8huNUD',
            TOKEN: 'JxFWG9byz8M75c7IZcha'
        };

        // ============================================================
        // URL DE L'API PAYDUNYA (Version corrigée)
        // ============================================================
        // Utilise l'API v3 de PayDunya
        const PAYDUNYA_API_URL = 'https://app.paydunya.com/api/v1/checkout/invoice/create';

        // ============================================================
        // FONCTIONS UTILITAIRES
        // ============================================================
        function generateOrderId() {
            const date = new Date();
            const timestamp = date.getFullYear() +
                String(date.getMonth() + 1).padStart(2, '0') +
                String(date.getDate()).padStart(2, '0') +
                String(date.getHours()).padStart(2, '0') +
                String(date.getMinutes()).padStart(2, '0') +
                String(date.getSeconds()).padStart(2, '0');
            const random = Math.random().toString(36).substr(2, 6).toUpperCase();
            return 'CMD-' + timestamp + '-' + random;
        }

        function showDebug(message) {
            const debugDiv = document.getElementById('debug');
            debugDiv.style.display = 'block';
            debugDiv.textContent += message + '\n';
            console.log(message);
        }

        // ============================================================
        // INITIALISATION
        // ============================================================
        document.getElementById('orderId').value = generateOrderId();

        // ============================================================
        // GESTION DU FORMULAIRE
        // ============================================================
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const operator = document.getElementById('operator').value;
            const phoneInput = document.getElementById('phone').value.trim();
            const amount = document.getElementById('amount').value.trim();
            const orderId = document.getElementById('orderId').value;

            const messageDiv = document.getElementById('message');
            const loadingDiv = document.getElementById('loading');
            const payBtn = document.getElementById('payBtn');
            const debugDiv = document.getElementById('debug');

            // Effacer le debug
            debugDiv.textContent = '';
            debugDiv.style.display = 'none';

            // ============================================================
            // VALIDATION
            // ============================================================
            const cleanPhone = phoneInput.replace(/[\s\-.]/g, '');
            if (!/^[0-9]{9}$/.test(cleanPhone)) {
                messageDiv.className = 'error';
                messageDiv.textContent = '❌ Numéro invalide. Entrez 9 chiffres (ex: 771234567)';
                messageDiv.style.display = 'block';
                return;
            }

            const amountNum = parseFloat(amount);
            if (isNaN(amountNum) || amountNum < 100) {
                messageDiv.className = 'error';
                messageDiv.textContent = '❌ Montant invalide. Minimum 100 CFA';
                messageDiv.style.display = 'block';
                return;
            }

            messageDiv.style.display = 'none';
            messageDiv.className = '';

            // ============================================================
            // PRÉPARER LA REQUÊTE PAYDUNYA (Format correct)
            // ============================================================
            const payload = {
                invoice: {
                    total_amount: amountNum,
                    description: 'Achat sur ma boutique - ' + orderId,
                    items: [{
                        name: 'Commande ' + orderId,
                        quantity: 1,
                        unit_price: amountNum,
                        total_price: amountNum
                    }]
                },
                customer: {
                    phone: cleanPhone,
                    email: 'client@test.com'
                },
                actions: {
                    cancel_url: window.location.href + '?cancelled=true',
                    return_url: window.location.href + '?status=success&order=' + orderId,
                    callback_url: window.location.origin + '/webhook.php'
                },
                store: {
                    name: 'Ma Boutique Test'
                },
                channels: [operator],
                mode: 'test'
            };

            showDebug('📤 Envoi à PayDunya :\n' + JSON.stringify(payload, null, 2));

            // ============================================================
            // APPEL API PAYDUNYA
            // ============================================================
            payBtn.disabled = true;
            payBtn.textContent = '⏳...';
            loadingDiv.classList.add('show');

            try {
                const response = await fetch(PAYDUNYA_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'PAYDUNYA-MASTER-KEY': PAYDUNYA_CONFIG.MASTER_KEY,
                        'PAYDUNYA-PRIVATE-KEY': PAYDUNYA_CONFIG.PRIVATE_KEY,
                        'PAYDUNYA-TOKEN': PAYDUNYA_CONFIG.TOKEN,
                        'PAYDUNYA-MODE': 'test'
                    },
                    body: JSON.stringify(payload)
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    data = { raw: responseText };
                }

                showDebug('📥 Réponse PayDunya :\n' + JSON.stringify(data, null, 2));

                // Vérifier si la réponse est un succès
                if (data.response_code === '00' || data.success === true) {
                    const redirectUrl = data.response_data?.redirect_url || 
                                       data.redirect_url || 
                                       data.payment_url;

                    if (redirectUrl) {
                        messageDiv.className = 'success';
                        messageDiv.textContent = '✅ Redirection vers PayDunya...';
                        messageDiv.style.display = 'block';
                        
                        setTimeout(() => {
                            window.location.href = redirectUrl;
                        }, 1500);
                    } else {
                        // Peut-être que l'URL est dans response_data
                        if (data.response_data && typeof data.response_data === 'object') {
                            const url = data.response_data.url || data.response_data.redirect_url;
                            if (url) {
                                setTimeout(() => {
                                    window.location.href = url;
                                }, 1500);
                                return;
                            }
                        }
                        throw new Error('URL de redirection non trouvée dans la réponse');
                    }
                } else {
                    // Erreur PayDunya
                    const errorMsg = data.response_text || data.message || JSON.stringify(data);
                    throw new Error(errorMsg);
                }

            } catch (error) {
                showDebug('❌ Erreur : ' + error.message);
                messageDiv.className = 'error';
                messageDiv.textContent = '❌ Erreur : ' + error.message;
                messageDiv.style.display = 'block';

                payBtn.disabled = false;
                payBtn.textContent = '💳 Payer maintenant';
                loadingDiv.classList.remove('show');
            }
        });

        // ============================================================
        // GÉRER LE RETOUR DE PAIEMENT
        // ============================================================
        (function checkPaymentStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            const status = urlParams.get('status');
            const orderId = urlParams.get('order');

            if (status === 'success' && orderId) {
                const messageDiv = document.getElementById('message');
                messageDiv.className = 'success';
                messageDiv.innerHTML = `✅ <strong>Paiement réussi !</strong><br>Commande ${orderId} confirmée. Merci pour votre achat !`;
                messageDiv.style.display = 'block';

                if (window.history && window.history.replaceState) {
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }

            const cancelled = urlParams.get('cancelled');
            if (cancelled === 'true') {
                const messageDiv = document.getElementById('message');
                messageDiv.className = 'error';
                messageDiv.textContent = '❌ Paiement annulé. Vous pouvez réessayer.';
                messageDiv.style.display = 'block';
            }
        })();

        // Rafraîchir l'ID si nécessaire
        if (!window.location.search.includes('status=success')) {
            document.getElementById('orderId').value = generateOrderId();
        }
    </script>
</body>
</html>
